<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieBox — Watch anything</title>
  <link rel="icon" href="/assets/logo.png" />
  <style>
    :root{--bg:#08090d;--panel:#12141c;--panel2:#181b26;--text:#f7f7fb;--muted:#9297a7;--line:#272b38;--accent:#ff3157;--accent2:#ff6b45}*{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(800px 500px at 85% -10%,#37203a55,transparent 65%),var(--bg)}button,input{font:inherit}.shell{max-width:1280px;margin:0 auto;padding:0 32px 56px}.nav{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d}.brand{display:flex;gap:11px;align-items:center;font-weight:800;font-size:20px;letter-spacing:-.5px}.brand img{width:34px;height:34px;border-radius:10px}.nav-note{color:var(--muted);font-size:13px}.hero{padding:74px 0 54px;max-width:760px}.eyebrow{color:#ff6882;text-transform:uppercase;letter-spacing:2.5px;font-size:11px;font-weight:800;margin-bottom:20px}.hero h1{font-size:clamp(42px,6vw,78px);line-height:.98;letter-spacing:-4px;margin:0 0 22px;font-weight:850}.hero h1 span{background:linear-gradient(100deg,#fff 10%,#ff5574 78%);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{font-size:17px;color:var(--muted);line-height:1.6;max-width:570px;margin:0}.search{display:flex;max-width:720px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px;margin-top:32px;box-shadow:0 18px 45px #0005}.search input{background:transparent;border:0;outline:0;color:var(--text);padding:13px 16px;flex:1;font-size:16px;min-width:0}.search button,.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border-radius:9px;padding:0 22px;font-weight:750;cursor:pointer}.search button:hover,.primary:hover{filter:brightness(1.1)}.section-head{display:flex;align-items:end;justify-content:space-between;margin:18px 0 18px}.section-head h2{font-size:21px;margin:0;letter-spacing:-.5px}.section-head small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}.card{background:var(--panel);border:1px solid #ffffff0a;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}.card:hover{transform:translateY(-5px);border-color:#ff456655;box-shadow:0 16px 32px #0007}.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#33213b,#141722);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.poster:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#08090dcc,transparent 50%);pointer-events:none}.poster .mark{font-size:42px;font-weight:900;color:#ffffff22}.tag{position:absolute;left:9px;top:9px;z-index:1;background:#08090dcc;border:1px solid #ffffff25;border-radius:5px;padding:4px 7px;font-size:10px;font-weight:800;text-transform:uppercase}.card-copy{padding:12px 12px 14px}.title{font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:6px}.empty{border:1px dashed var(--line);border-radius:14px;padding:54px;text-align:center;color:var(--muted);grid-column:1/-1}.loading{color:var(--muted);padding:30px 0}.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-bg.open{display:flex}.modal{width:min(720px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 90px #000}.detail{display:grid;grid-template-columns:220px 1fr;gap:26px;padding:26px}.detail .poster{border-radius:10px}.detail h2{font-size:32px;line-height:1.05;letter-spacing:-1.4px;margin:8px 0 10px}.detail p{color:var(--muted);line-height:1.6}.close{position:absolute;margin:14px 16px 0 auto;right:0;top:0;background:#ffffff15;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:20px}.modal-top{position:relative}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.secondary{background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:9px;padding:11px 15px;cursor:pointer}.status{font-size:13px;color:var(--muted);margin-top:15px;white-space:pre-line}.streams{display:flex;flex-direction:column;gap:9px;margin-top:16px}.stream{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:13px}.stream a{color:#ff7189;font-weight:700;text-decoration:none;white-space:nowrap}@media(max-width:640px){.shell{padding:0 17px 40px}.nav-note{display:none}.hero{padding:52px 0 38px}.hero h1{letter-spacing:-2.5px}.detail{grid-template-columns:110px 1fr;gap:16px;padding:20px}.detail h2{font-size:23px}.detail p{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="nav"><div class="brand"><img src="/assets/logo.png" alt="MovieBox"/>MovieBox</div><div class="nav-note">Powered by your MovieBox API access</div></nav>
    <section class="hero"><div class="eyebrow">Your private streaming library</div><h1>Find something<br/><span>worth watching.</span></h1><p>Search movies and series from MovieBox, then resolve the best available stream in one click.</p><form class="search" id="searchForm"><input id="query" autocomplete="off" placeholder="Search a movie or series…"/><button>Search</button></form></section>
    <section><div class="section-head"><h2 id="heading">Popular picks</h2><small id="count"></small></div><div class="grid" id="grid"><div class="empty">Search for a title to explore your library.</div></div></section>
  </main>
  <div class="modal-bg" id="modal"><div class="modal"><div class="modal-top"><button class="close" id="close">×</button><div class="detail" id="detail"></div></div></div></div>
<script>
const grid=document.querySelector('#grid'), modal=document.querySelector('#modal'), detail=document.querySelector('#detail');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function poster(item){return item.poster?`<img src="${esc(item.poster)}" loading="lazy" onerror="this.remove()"/>`:`<div class="mark">M</div>`}
function cards(items){grid.innerHTML=items.length?items.map((x,i)=>`<article class="card" data-i="${i}"><div class="poster">${poster(x)}<span class="tag">${esc(x.type)}</span></div><div class="card-copy"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.year||'—')} · ${x.type==='series'?'Series':'Movie'}</div></div></article>`).join(''):'<div class="empty">No matches found. Try a different title.</div>';grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>open(items[c.dataset.i]));}
let current=[];
async function search(q){grid.innerHTML='<div class="loading">Searching MovieBox…</div>';document.querySelector('#heading').textContent=`Results for “${q}”`;document.querySelector('#count').textContent='';try{const r=await fetch(`/api/search?q=${encodeURIComponent(q)}`);const d=await r.json();if(!r.ok)throw Error(d.detail||'Search failed');current=d.items||[];document.querySelector('#count').textContent=`${current.length} titles`;cards(current)}catch(e){grid.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function open(x){modal.classList.add('open');detail.innerHTML=`<div class="poster">${poster(x)}</div><div><div class="eyebrow">${esc(x.type)} · ${esc(x.year||'MovieBox')}</div><h2>${esc(x.title)}</h2><p>${x.type==='series'?'Choose an episode to resolve a stream.':'Ready to watch in the best available quality.'}</p><div class="actions"><button class="primary" id="resolve">Resolve streams</button><button class="secondary" id="copy">Copy title</button></div><div class="status" id="status"></div><div class="streams" id="streams"></div></div>`;document.querySelector('#resolve').onclick=()=>resolve(x);document.querySelector('#copy').onclick=()=>navigator.clipboard?.writeText(x.title);}
async function resolve(x){const status=document.querySelector('#status');status.textContent='Finding available streams…';document.querySelector('#streams').innerHTML='';try{const r=await fetch(`/api/streams/${x.type}/${encodeURIComponent(x.id)}?season=1&episode=1`);const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not resolve streams');if(!d.streams?.length){status.textContent='No streams were found for this title.';return}status.textContent=`${d.streams.length} stream${d.streams.length>1?'s':''} available`;document.querySelector('#streams').innerHTML=d.streams.map(s=>`<div class="stream"><span>${esc(s.title||'Available stream').replaceAll('\n',' · ')}</span><a href="${esc(s.url)}" target="_blank" rel="noreferrer">Open ↗</a></div>`).join('')}catch(e){status.textContent=e.message}}
document.querySelector('#searchForm').onsubmit=e=>{e.preventDefault();const q=document.querySelector('#query').value.trim();if(q)search(q)};document.querySelector('#close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
</script></body></html>
